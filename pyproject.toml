[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powerguess"
dynamic = ["version"]
description = "Estimate or measure the power draw of a Linux device — a pure power library"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "JarbasAi", email = "jarbasai@mailfence.com"}]
keywords = ["power", "energy", "estimation", "powerstat", "rapl", "raspberry-pi",
            "ina219", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "psutil",
    "pexpect",
]

[project.optional-dependencies]
# Optional INA219 I2C power-monitor support (Raspberry Pi / SBC power HATs).
ina219 = ["smbus2"]
test = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/JarbasAl/powerguess"

[tool.setuptools.dynamic]
version = {attr = "powerguess.version.__version__"}

[tool.setuptools.packages.find]
include = ["powerguess*"]
exclude = ["test*"]

[tool.setuptools.package-data]
"powerguess.models" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"

